<!doctype html>
<html lang="pt-BR">
<body style="margin: 0; padding: 24px; background: #f4f6f9; font-family: Arial, sans-serif; color: #1a1f2b;">
<table role="presentation" width="100%" style="max-width: 560px; margin: 0 auto; background: #ffffff; border: 1px solid #d9dee7; border-radius: 8px; border-collapse: separate;">
    <tr>
        <td style="padding: 20px 24px; border-bottom: 3px solid #c0352b;">
            <div style="font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #c0352b; font-weight: bold;">Urgência {avaliacao.urgencia.descricao}</div>
            <div style="font-size: 20px; font-weight: bold; margin-top: 4px;">Nova avaliação precisa de atenção</div>
        </td>
    </tr>
    <tr>
        <td style="padding: 20px 24px;">
            <table role="presentation" width="100%" style="border-collapse: collapse; font-size: 14px;">
                <tr>
                    <td style="padding: 8px 0; color: #5d6677; width: 140px; vertical-align: top;">Descrição</td>
                    <td style="padding: 8px 0;">{avaliacao.descricao}</td>
                </tr>
                <tr>
                    <td style="padding: 8px 0; color: #5d6677;">Nota</td>
                    <td style="padding: 8px 0;">{avaliacao.nota} de 10</td>
                </tr>
                <tr>
                    <td style="padding: 8px 0; color: #5d6677;">Urgência</td>
                    <td style="padding: 8px 0;">{avaliacao.urgencia.descricao}</td>
                </tr>
                <tr>
                    <td style="padding: 8px 0; color: #5d6677;">Data de envio</td>
                    <td style="padding: 8px 0;">{avaliacao.dataEnvio.format('dd/MM/yyyy HH:mm')}</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
