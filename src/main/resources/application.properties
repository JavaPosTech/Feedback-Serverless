quarkus.package.jar.type=legacy-jar
quarkus.devservices.enabled=false

quarkus.azure-functions.app-name=${FUNCTION_APP_NAME:func-feedback-dev}
quarkus.azure-functions.resource-group=rg-feedback-dev
quarkus.azure-functions.region=brazilsouth
quarkus.azure-functions.runtime.os=linux
quarkus.azure-functions.runtime.java-version=21

quarkus.datasource.db-kind=mssql
quarkus.datasource.jdbc.url=${DATABASE_URL}
%dev.quarkus.datasource.jdbc.url=jdbc:sqlserver://${DATABASE_IP:localhost}:${DATABASE_PORT:1433};databaseName=${DATABASE_NAME:feedback};encrypt=true;trustServerCertificate=true
%test.quarkus.datasource.jdbc.url=jdbc:sqlserver://${DATABASE_IP:localhost}:${DATABASE_PORT:1433};databaseName=feedback_test;encrypt=true;trustServerCertificate=true
%dev,test.quarkus.datasource.username=${DATABASE_USER:sa}
%dev,test.quarkus.datasource.password=${DATABASE_PASSWORD:Feedback@Local2026}

quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.locations=db/migration,db/test

feedback.fuso-horario=America/Sao_Paulo

feedback.fila.nome=avaliacoes-criticas
%test.feedback.fila.nome=avaliacoes-criticas-teste
feedback.fila.endpoint=${FILA_ENDPOINT:}
%dev,test.feedback.fila.connection-string=${AzureWebJobsStorage:UseDevelopmentStorage=true}

feedback.email.simulado=false
feedback.email.remetente=${EMAIL_REMETENTE}
feedback.email.destinatarios=${EMAIL_DESTINATARIOS}
feedback.email.connection-string=${EMAIL_CONNECTION_STRING:}
%dev,test.feedback.email.simulado=true
%dev,test.feedback.email.remetente=DoNotReply@feedback.local
%dev,test.feedback.email.destinatarios=admin@feedback.local