name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Subir SQL Server e Azurite
        run: docker compose up -d --wait

      - name: Compilar e rodar os testes
        run: bash gradlew build --no-daemon

      - name: Derrubar os containers
        if: always()
        run: docker compose down -v