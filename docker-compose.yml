services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    container_name: feedback-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DATABASE_PASSWORD:-Feedback@Local2026}
    ports:
      - "1433:1433"
    command:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        until /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "IF DB_ID('feedback') IS NULL CREATE DATABASE feedback; IF DB_ID('feedback_test') IS NULL CREATE DATABASE feedback_test" > /dev/null 2>&1; do sleep 3; done
        wait
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -d feedback_test -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    container_name: feedback-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10001"]
      interval: 5s
      timeout: 3s
      retries: 20